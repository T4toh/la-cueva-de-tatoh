<footer class="footer">
  <span class="version">v{{ version }}</span>
  <span class="separator">·</span>
  <button class="link" type="button" (click)="abrir()">Changelog</button>
</footer>

<!-- El cierre por teclado lo maneja el <dialog> nativo (Escape) y onEsc() en el TS. -->
<!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
<dialog
  #dialogEl
  class="changelog-dialog"
  (click)="onDialogClick($event)"
>
  <div class="dialog-content">
    <header class="dialog-header">
      <h3>Changelog</h3>
      <button
        aria-label="Cerrar"
        class="btn-close"
        type="button"
        (click)="cerrar()"
      >×</button>
    </header>
    <div class="dialog-body">
      @if (cargado()) {
        <markdown class="changelog-md" [src]="changelogUrl()" />
      }
    </div>
  </div>
</dialog>
