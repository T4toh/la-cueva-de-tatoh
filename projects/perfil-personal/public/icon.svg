<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- La Cueva de Tatoh: la boca de la cueva en el cerro y la t de la familia de tWriter. Paleta cueva -->
  <defs>
    <clipPath id="tile"><rect x="32" y="32" width="960" height="960" rx="215"/></clipPath>
  </defs>
  <!-- tile -->
  <rect x="32" y="32" width="960" height="960" rx="215" fill="#14151A"/>
  <g clip-path="url(#tile)">
    <!-- cerro -->
    <path d="M 40 1000 L 320 420 L 430 520 L 610 250 L 1000 1000 Z" fill="#6F6FBF" stroke="#6F6FBF" stroke-width="70" stroke-linejoin="round"/>
    <!-- boca de la cueva -->
    <path d="M 302 1000 L 302 640 A 210 210 0 0 1 722 640 L 722 1000 Z" fill="#ECEBE7"/>
  </g>
  <!-- t -->
  <g transform="translate(516 708) scale(0.8) translate(-516 -550)" fill="none" stroke="#14151A" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 462 388 L 462 626 Q 462 710 546 710 Q 590 710 616 681" stroke-width="66"/>
    <path d="M 364 458 L 668 458" stroke-width="54"/>
  </g>
</svg>
