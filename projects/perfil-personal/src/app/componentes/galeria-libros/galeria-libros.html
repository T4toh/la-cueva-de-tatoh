<div class="galeria">
  @for (libro of libros(); track libro.slug) {
    <a class="libro-link" [routerLink]="['/libros', libro.slug]">
      <lib-libro
        [imagen]="libro.imagen"
        [subtitulo]="libro.saga + ' #' + libro.numero"
        [titulo]="libro.titulo"
      />
    </a>
  }
</div>
