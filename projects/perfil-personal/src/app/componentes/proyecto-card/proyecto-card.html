<a
  class="proyecto-card"
  rel="noopener noreferrer"
  target="_blank"
  [href]="url()"
  [style.--color-proyecto]="color()"
>
  <span class="cabecera">
    @if (imagen(); as src) {
      <img alt="" class="imagen" height="28" width="28" [ngSrc]="src" />
    } @else {
      <lib-icon [name]="icono()" [size]="18" />
    }
    <span class="etiqueta">{{ etiqueta() }}</span>
  </span>

  <h3>{{ nombre() }}</h3>
  <p>{{ descripcion() }}</p>
</a>
