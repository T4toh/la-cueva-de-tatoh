<nav class="navigator">
  <ul>
    <li>
      <button
        aria-controls="sidebar"
        class="toggle-sidebar"
        type="button"
        [attr.aria-expanded]="sidebarAbierto()"
        [attr.aria-label]="sidebarAbierto() ? 'Ocultar el panel' : 'Mostrar el panel'"
        (click)="alternarSidebar.emit()"
      >
        <lib-icon name="menu" [size]="18" />
      </button>
    </li>
    <li>
      <a
        aria-label="Inicio"
        class="home-link"
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <lib-icon name="home" [size]="18" />
      </a>
    </li>
    <li>
      <a routerLink="/blog" routerLinkActive="active">
        <lib-icon name="pen-tool" [size]="16" />
        <span>Blog</span>
      </a>
    </li>
    <li>
      <a routerLink="/utilidades" routerLinkActive="active">
        <lib-icon name="wrench" [size]="16" />
        <span>Utilidades</span>
      </a>
    </li>
    <li>
      <a routerLink="/libros" routerLinkActive="active">
        <lib-icon name="book-open" [size]="16" />
        <span>Libros</span>
      </a>
    </li>
    <li>
      <a href="https://comidas.tatoh.ar" rel="noopener" target="_blank">
        <lib-icon name="utensils" [size]="16" />
        <span>Comidas</span>
      </a>
    </li>
  </ul>

  <div class="tiendas-autor">
    @for (tienda of tiendas; track tienda.url) {
      <a
        class="tienda-autor-link"
        rel="noopener noreferrer"
        target="_blank"
        [href]="tienda.url"
        [title]="'Ver mis libros en ' + tienda.nombre"
      >
        <app-logo-tienda [size]="18" [tienda]="tienda.logo" />
      </a>
    }
  </div>
</nav>
