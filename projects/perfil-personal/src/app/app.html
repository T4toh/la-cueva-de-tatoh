<section class="layout" [class.sidebar-cerrado]="!sidebarAbierto()">
  <aside class="sidebar" id="sidebar">
    <app-sidebar />
  </aside>

  <!-- Solo se ve en mobile, donde el panel tapa el contenido. -->
  <button
    aria-label="Cerrar el panel"
    class="backdrop"
    type="button"
    (click)="alternarSidebar()"
  ></button>

  <div #cuerpo class="body">
    <app-navigator
      [sidebarAbierto]="sidebarAbierto()"
      (alternarSidebar)="alternarSidebar()"
    />
    <router-outlet />
  </div>
</section>
