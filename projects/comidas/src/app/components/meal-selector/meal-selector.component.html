<div class="selector-container">
  <p class="contexto">{{ type }} del {{ dayName }}</p>

  @if (showingList()) {
    <div class="actions">
      <button class="btn-secondary" routerLink="/" type="button">
        Volver sin cambios
      </button>
      <button class="btn-danger" type="button" (click)="clearSelection()">
        Borrar y dejar vacío
      </button>
    </div>

    @if (uniqueTags().length > 0) {
      <div class="filters">
        <button
          type="button"
          [class.active]="selectedTag() === null"
          (click)="selectTag(null)"
        >
          Todos
        </button>
        @for (tag of uniqueTags(); track tag) {
          <button
            type="button"
            [class.active]="selectedTag() === tag"
            (click)="selectTag(tag)"
          >
            {{ tag }}
          </button>
        }
      </div>
    }

    <div class="grid">
      @for (meal of filteredMeals(); track meal.id) {
        <app-meal-card
          [meal]="meal"
          [showDuplicate]="true"
          [showEdit]="true"
          (cardClick)="selectMeal(meal.id)"
          (duplicate)="duplicateMeal($event)"
          (edit)="editMeal($event)"
        />
      } @empty {
        <p class="empty-state">
          No hay comidas creadas.
          <a routerLink="/meals/new">Crear una nueva</a>
        </p>
      }
    </div>
  } @else if (currentMeal(); as meal) {
    <app-receta-detalle [meal]="meal" [porcionesFijas]="porciones()">
      <button class="btn-secondary" routerLink="/" type="button">Volver</button>
      <button class="btn-secondary" type="button" (click)="showList()">
        Cambiar comida
      </button>
      <button class="btn-danger" type="button" (click)="clearSelection()">
        Borrar
      </button>
    </app-receta-detalle>
  } @else {
    <div class="actions">
      <button class="btn-secondary" routerLink="/" type="button">Volver</button>
      <button class="btn-secondary" type="button" (click)="showList()">
        Elegir comida
      </button>
    </div>
  }
</div>
