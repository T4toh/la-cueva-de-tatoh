@if (meal(); as comida) {
  <app-receta-detalle [meal]="comida">
    <a class="volver" routerLink="/meals">
      <lib-icon name="arrow-right" [size]="16" />
      Comidas
    </a>
  </app-receta-detalle>
} @else {
  <div class="no-existe">
    <p class="vacio">Esa comida no existe.</p>
    <a class="btn-secondary" routerLink="/meals">Volver a comidas</a>
  </div>
}
