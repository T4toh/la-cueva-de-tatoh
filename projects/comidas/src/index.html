<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Comidas</title>
    <base href="/" />
    <!-- Antes del primer paint: si el usuario eligió un tema explícito, hay
         que aplicarlo ya. Sin esto se ve el tema del sistema hasta que arranca
         Angular y el TemaService escribe el atributo. La clave de localStorage
         la comparte con `componentes/src/lib/tema/tema.service.ts`. -->
    <script>
      try {
        var tema = localStorage.getItem('tema');
        if (tema === 'claro' || tema === 'oscuro') {
          document.documentElement.dataset.tema = tema;
        }
      } catch (e) {
        // Modo privado o storage bloqueado: manda el prefers-color-scheme.
      }
    </script>
    <meta
      content="width=device-width, initial-scale=1, viewport-fit=cover"
      name="viewport"
    />
    <!-- Un solo theme-color, y lo mantiene al día el TemaService. Dos metas
         con `media` no sirven: el transform del index.html colapsa los
         duplicados por `name` y descarta el atributo `media`. -->
    <meta content="#1c1d23" name="theme-color" />
    <link href="icon.png" rel="icon" type="image/png" />

    <!-- Preconnect para optimizar carga de fuentes -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />

    <!-- Preload + carga asíncrona de fuentes editorial.
         Un solo <link> que se promueve a stylesheet en onload — evita
         "preloaded but not used" cuando preload y stylesheet difieren. -->
    <link
      as="style"
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..700;1,400..700&amp;family=Inter:wght@400..600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
      rel="preload"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..700;1,400..700&family=Inter:wght@400..600&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <link href="manifest.webmanifest" rel="manifest" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
